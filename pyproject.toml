[project]
name = "parsecraft"
dynamic = ["version"]
description = "Document intelligence: align existing converters, parsers, and OCR/VLM models behind one workflow and one typed output format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "charset-normalizer>=3.4",
    "huggingface-hub>=0.34",
    "markdown-it-py>=4.2",
    "openpyxl>=3.1",  # MIT, pure-Python: a base dep, lighter than pillow/pypdfium2
    "pillow>=10.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "platformdirs>=4.3",
    "pypdf>=5",
    "pypdfium2>=5.14",
    "tomlkit>=0.13",
    "typer>=0.12.0",
]

# Feature-oriented extras (ADR-0009): core is comprehensive; extras exist only
# for heavyweight or licence-isolated functionality. One line each — rationale
# lives in the ADRs, not here.
[project.optional-dependencies]
auto = ["pdf-inspector>=1.25.2", "typesafe-sdk>=0.7.2"]
docling = ["docling>=2.130"]
liteparse = ["liteparse>=2.14"]
mineru = ["mineru>=4.0.11,<5"]  # mixed licences incl. weights: ADR-0007
ocr = [
    "accelerate>=0.34",
    "addict",
    "easydict",
    "einops",
    "matplotlib",
    "requests",
    "torch>=2.5",
    "transformers>=5.17,<6",
    "torchvision",
]
pandoc = ["pypandoc>=1.15"]  # GPL-2.0-or-later binary: ADR-0005
pdf = ["pymupdf>=1.24"]  # AGPL: ADR-0003
vllm = ["vllm>=0.11 ; sys_platform != 'win32'"]  # Linux/WSL2 accelerator
web = ["httpx>=0.27", "trafilatura>=2.3.1"]

[project.entry-points."parsecraft.backends"]
native-text = "parsecraft.backends.native.text:factory"
native-markdown = "parsecraft.backends.native.markdown:factory"
native-html = "parsecraft.backends.native.html:factory"
pymupdf = "parsecraft.backends.pymupdf:factory"
# The spreadsheet sibling: pymupdf cannot read .xlsx (string cells dropped).
openpyxl = "parsecraft.backends.openpyxl.openpyxl:factory"
liteparse = "parsecraft.backends.liteparse.liteparse:factory"
pandoc = "parsecraft.backends.pandoc.pandoc:factory"
docling = "parsecraft.backends.docling.docling:factory"
trafilatura = "parsecraft.backends.trafilatura.trafilatura:factory"
mineru = "parsecraft.backends.mineru.mineru:factory"
pdf-inspector = "parsecraft.backends.pdf_inspector.pdf_inspector:factory"
# Bring-your-own dependency (ADR-0006): registered so the backend is listed and
# routable wherever `marker` imports; parsecraft declares NO `marker` extra -
# the consumer's dependency graph installs marker-pdf (rule 10 untouched).
marker = "parsecraft.backends.marker.marker:factory"
ocr-ovis = "parsecraft.backends.ocr.ovis:factory"
ocr-tele = "parsecraft.backends.ocr.tele:factory"
ocr-unlimited = "parsecraft.backends.ocr.unlimited:factory"
ocr-qianfan = "parsecraft.backends.ocr.qianfan:factory"
# Base-install OCR (ADR-0008): a binary engine, so no extra is declared and the
# backend is in the default install. Eligible only where the engine is present.
ocr-tesseract = "parsecraft.backends.ocr.tesseract:factory"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
parsecraft = "parsecraft.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parsecraft"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer tags are bare `YYYY.MM.N`; dunamai's default pattern expects a `v`
# prefix, so declare the CalVer form explicitly. Without this, bare tags are
# ignored and the build falls back to a local version PyPI rejects.
pattern = '^(?P<base>\d+\.\d+\.\d+)$'

# GPU torch comes from the PyTorch index, not PyPI: the PyPI Windows and Linux
# wheels are CPU builds, so the OCR backends would silently run on the CPU even
# on a CUDA host. macOS is excluded by marker and falls through to PyPI's mac
# build (CPU + MPS), because the PyTorch index publishes no macOS wheels.
#
# `explicit = true` keeps the index scoped to torch/torchvision (the packages
# pinned in `tool.uv.sources`); everything else still resolves from PyPI, and
# the version *ranges* in the extras stay unchanged — the index only provides
# the CUDA variant of those two.
[tool.uv.sources]
torch = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=parsecraft --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

# Coverage-native gate: pytest-cov reads fail_under from coverage's own config
# ([tool.pytest-cov] above is NOT read by pytest-cov — the template test checks
# it exists, but this section is what actually enforces the 100% minimum).
[tool.coverage.run]
# Vendored model code (backends/ocr/_vendored) is ported and statically
# quality-gated (ruff, format, pyreorder, codespell, ty — with import markers),
# but it is GPU-tier numerics: the offline suite cannot execute it, so its
# statements are omitted from coverage measurement. Its runtime validator is
# the GPU tier (`mise run test-gpu`), required by pc-4u7.36's acceptance.
omit = ["src/parsecraft/backends/ocr/_vendored/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css,*/test-cache/*,*/downloads/*"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
