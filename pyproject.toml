[project]
name = "parsecraft"
dynamic = ["version"]
description = "Document intelligence: align existing converters, parsers, and OCR/VLM models behind one workflow and one typed output format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "markdown-it-py>=4.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    "typer>=0.12.0",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.34"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
parsecraft = "parsecraft.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parsecraft"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer tags are bare `YYYY.MM.N`; dunamai's default pattern expects a `v`
# prefix, so declare the CalVer form explicitly. Without this, bare tags are
# ignored and the build falls back to a local version PyPI rejects.
pattern = '^(?P<base>\d+\.\d+\.\d+)$'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=parsecraft --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

# Coverage-native gate: pytest-cov reads fail_under from coverage's own config
# ([tool.pytest-cov] above is NOT read by pytest-cov — the template test checks
# it exists, but this section is what actually enforces the 100% minimum).
[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css,*/test-cache/*"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
