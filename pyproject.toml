[project]
name = "parsecraft"
dynamic = ["version"]
description = "Document intelligence: align existing converters, parsers, and OCR/VLM models behind one workflow and one typed output format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "charset-normalizer>=3.4",
    "markdown-it-py>=4.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    "typer>=0.12.0",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.34"]
web = ["httpx>=0.27"]
pdf-lite = ["pypdf>=5"]
pdf = ["pymupdf>=1.24"]
liteparse = ["liteparse>=2.14"]
vllm = ["vllm>=0.11"]
# OCR extras intentionally exclude PyMuPDF (AGPL): PDF input additionally needs
# `parsecraft[pdf]`, keeping the copyleft choice explicit (ADR-0003).
#
# Pins are GPU-smoke-verified (RTX A2000 8 GB, 2026-09-27, `mise run test-gpu`).
# The model cards pin DIFFERENT transformers majors, so the OCR extras are
# MUTUALLY EXCLUSIVE — install exactly one per environment; a combined install
# (e.g. `[ocr-ovis,ocr-tele]`) cannot resolve. For GPU use, install torch and
# torchvision from the PyTorch CUDA index first (they are CPU-only on PyPI for
# Windows). `vllm` paths are Linux/WSL2-only and were not validated here.
ocr-ovis = ["transformers>=5.0", "torch>=2.5", "torchvision", "pillow>=10.4", "accelerate>=0.34"]
ocr-qianfan = ["transformers>=5.0", "torch>=2.5", "torchvision", "pillow>=10.4", "accelerate>=0.34"]
ocr-tele = ["transformers==4.57.1", "torch>=2.5", "pillow>=10.4", "accelerate>=0.34"]
ocr-unlimited = [
    "transformers==4.57.1",
    "torch>=2.5",
    "pillow>=10.4",
    "accelerate>=0.34",
    "einops",
    "addict",
    "easydict",
    "matplotlib",
    "requests",
]

[tool.uv]
# The OCR extras pin different transformers majors (per model card), so they are
# mutually exclusive rather than jointly installable — declare it so `uv` can
# still resolve a universal lock.
conflicts = [
  [{ extra = "ocr-ovis" }, { extra = "ocr-tele" }],
  [{ extra = "ocr-ovis" }, { extra = "ocr-unlimited" }],
  [{ extra = "ocr-qianfan" }, { extra = "ocr-tele" }],
  [{ extra = "ocr-qianfan" }, { extra = "ocr-unlimited" }],
]

[project.entry-points."parsecraft.backends"]
native-text = "parsecraft.backends.native.text:factory"
native-markdown = "parsecraft.backends.native.markdown:factory"
native-html = "parsecraft.backends.native.html:factory"
native-pdf = "parsecraft.backends.native.pdf:factory"
liteparse = "parsecraft.backends.liteparse.liteparse:factory"
ocr-ovis = "parsecraft.backends.ocr.ovis:factory"
ocr-tele = "parsecraft.backends.ocr.tele:factory"
ocr-unlimited = "parsecraft.backends.ocr.unlimited:factory"
ocr-qianfan = "parsecraft.backends.ocr.qianfan:factory"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
parsecraft = "parsecraft.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parsecraft"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer tags are bare `YYYY.MM.N`; dunamai's default pattern expects a `v`
# prefix, so declare the CalVer form explicitly. Without this, bare tags are
# ignored and the build falls back to a local version PyPI rejects.
pattern = '^(?P<base>\d+\.\d+\.\d+)$'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=parsecraft --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

# Coverage-native gate: pytest-cov reads fail_under from coverage's own config
# ([tool.pytest-cov] above is NOT read by pytest-cov — the template test checks
# it exists, but this section is what actually enforces the 100% minimum).
[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css,*/test-cache/*,*/downloads/*"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
