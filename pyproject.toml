[project]
name = "parsecraft"
dynamic = ["version"]
description = "Document intelligence: align existing converters, parsers, and OCR/VLM models behind one workflow and one typed output format"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "charset-normalizer>=3.4",
    "markdown-it-py>=4.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    "typer>=0.12.0",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.34"]
web = ["httpx>=0.27"]
pdf-lite = ["pypdf>=5"]
pdf = ["pymupdf>=1.24"]
liteparse = ["liteparse>=2.14"]
# GPL-2.0-or-later pandoc BINARY behind the MIT pypandoc wrapper — the
# user's licence decision (ADR-0005); never installed by `mise dev`/CI.
pandoc = ["pypandoc>=1.15"]
docling = ["docling>=2.130"]
# PDF-only Rust/PyO3 extractor: prebuilt abi3 wheels, no Python deps, no OCR runtime.
pdf-inspector = ["pdf-inspector>=1.25.2"]
# The vLLM path is Linux/WSL2-only (runtime AND install): the marker keeps
# Windows resolvable with every extra enabled at once.
vllm = ["vllm>=0.11 ; sys_platform != 'win32'"]
# OCR extras intentionally exclude PyMuPDF (AGPL): PDF input additionally needs
# `parsecraft[pdf]`, keeping the copyleft choice explicit (ADR-0003).
#
# ONE transformers window for all four OCR models — `uv sync -U --all-extras`
# must always resolve (root AGENTS.md rule 10; extras are never mutually
# exclusive). 5.17.0 is the verified member of the window; a runtime guard
# names it (`backends/ocr/_common.py`). GPU torch comes from the pinned
# PyTorch cu128 index (see [tool.uv.index] below) — no manual CUDA install.
# The same window is enforced at runtime as TRANSFORMERS_RANGE in backends/ocr/_models.py.
ocr-ovis = ["transformers>=5.17,<6", "torch>=2.5", "torchvision", "pillow>=10.4", "accelerate>=0.34"]
ocr-qianfan = ["transformers>=5.17,<6", "torch>=2.5", "torchvision", "pillow>=10.4", "accelerate>=0.34"]
ocr-tele = ["transformers>=5.17,<6", "torch>=2.5", "torchvision", "pillow>=10.4", "accelerate>=0.34"]
ocr-unlimited = [
    "transformers>=5.17,<6",
    "torch>=2.5",
    "torchvision",
    "pillow>=10.4",
    "accelerate>=0.34",
    "einops",
    "addict",
    "easydict",
    "matplotlib",
    "requests",
]
# TypeSafe System One judge providers (typesafe cloud, OpenCode Zen, local
# Ollama): one pure-Python MIT SDK (typesafe-sdk) behind the optional
# `systemone` routing extra, injected per endpoint via base_url/api_key.
# `load_judge` imports it via importlib, so it stays out of the core import path
# and out of the dev/CI venv.
systemone = ["typesafe-sdk>=0.7.2"]
# Meta-extra: one install for the whole auto-routing flags story — the classifier
# (`--classifier pdfinspector/detect_pdf`) and the judge providers (`--judge
# typesafe-ai|zen|ollama`). Self-referential by design: it pulls in extras this
# package already declares, so the parts stay independently installable and this
# adds no dependency of its own. Deliberately NOT widened with `pdf`/`pdf-lite`
# (or any OCR backend extra): routing flags and PDF extraction are separate
# decisions, and a meta-extra must never smuggle in a copyleft or GPU stack.
# Nothing imports it, so it has no `EXTRA_IMPORTS` entry — `META_EXTRAS` in
# `environment/probe.py` records that distinction.
auto = ["parsecraft[systemone]", "parsecraft[pdf-inspector]"]

[project.entry-points."parsecraft.backends"]
native-text = "parsecraft.backends.native.text:factory"
native-markdown = "parsecraft.backends.native.markdown:factory"
native-html = "parsecraft.backends.native.html:factory"
native-pdf = "parsecraft.backends.native.pdf:factory"
liteparse = "parsecraft.backends.liteparse.liteparse:factory"
pandoc = "parsecraft.backends.pandoc.pandoc:factory"
docling = "parsecraft.backends.docling.docling:factory"
pdf-inspector = "parsecraft.backends.pdf_inspector.pdf_inspector:factory"
ocr-ovis = "parsecraft.backends.ocr.ovis:factory"
ocr-tele = "parsecraft.backends.ocr.tele:factory"
ocr-unlimited = "parsecraft.backends.ocr.unlimited:factory"
ocr-qianfan = "parsecraft.backends.ocr.qianfan:factory"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
]

[project.scripts]
parsecraft = "parsecraft.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parsecraft"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
# CalVer tags are bare `YYYY.MM.N`; dunamai's default pattern expects a `v`
# prefix, so declare the CalVer form explicitly. Without this, bare tags are
# ignored and the build falls back to a local version PyPI rejects.
pattern = '^(?P<base>\d+\.\d+\.\d+)$'

# GPU torch comes from the PyTorch index, not PyPI: the PyPI Windows and Linux
# wheels are CPU builds, so the OCR backends would silently run on the CPU even
# on a CUDA host. macOS is excluded by marker and falls through to PyPI's mac
# build (CPU + MPS), because the PyTorch index publishes no macOS wheels.
#
# `explicit = true` keeps the index scoped to torch/torchvision (the packages
# pinned in `tool.uv.sources`); everything else still resolves from PyPI, and
# the version *ranges* in the extras stay unchanged — the index only provides
# the CUDA variant of those two.
[tool.uv.sources]
torch = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.pytest-cov]
addopts = "--cov=parsecraft --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

# Coverage-native gate: pytest-cov reads fail_under from coverage's own config
# ([tool.pytest-cov] above is NOT read by pytest-cov — the template test checks
# it exists, but this section is what actually enforces the 100% minimum).
[tool.coverage.run]
# Vendored model code (backends/ocr/_vendored) is ported and statically
# quality-gated (ruff, format, pyreorder, codespell, ty — with import markers),
# but it is GPU-tier numerics: the offline suite cannot execute it, so its
# statements are omitted from coverage measurement. Its runtime validator is
# the GPU tier (`mise run test-gpu`), required by pc-4u7.36's acceptance.
omit = ["src/parsecraft/backends/ocr/_vendored/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css,*/test-cache/*,*/downloads/*"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
