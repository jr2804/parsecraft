# Public test-document manifest — ADR-0001 §8 (fixtures policy).
#
# Policy: NO document binaries are committed. This file records where real,
# permissively licensed documents live, why they are suitable, and the
# documented local step to obtain them into the self-ignored pytest cache
# (`tests/test-cache/downloads/`). The corpus tier fetches them on demand:
#   uv run pytest -m corpus --run-corpus --run-downloads
#   (or: mise run test-corpus)
# so `mise test` never touches the network.
#
# Research + HTTP verification date: 2026-09-27 (all urls below returned
# 200 except the ITU landing page, which blocks automated clients with
# HTTP 500 — hence `manual = true`, acquisition stays a human step).
#
# Corpus fields (Phase 4 auto-mode seam — these are DATA the routing harness
# asserts against; the harness itself is deliberately not implemented yet):
#   difficulty  = simple | medium | complex (complexity spread across corpus)
#   pages       = page count where known, else omitted
#   approx_size = pinned artifact size in bytes (exact for downloaded entries)
#   features    = any of images, figures, equations, tables, code
#   sha256      = pinned content hash; the content-addressed cache keys on it
#
# Drift semantics: a hash mismatch means upstream changed the artifact.
# Re-pin deliberately after review (benchmark inputs must not move silently).
#
# Fields: id (unique slug), format (must be scaffoldable), media_type,
# url (https), license, license_url, why (why suitable as a fixture),
# filename (target name inside the cache dir), download_step (single-line
# shell command writing into tests/test-cache/downloads/), manual
# (true = human-acquired, never automated, never committed).

[[sources]]
id = "gutenberg-pride-prejudice"
format = "txt"
media_type = "text/plain"
url = "https://www.gutenberg.org/cache/epub/1342/pg1342.txt"
license = "Public domain in the USA (Project Gutenberg)"
