[project]
name = "parsecraft-example-backend"
version = "0.1.0"
description = "Example third-party ParseCraft backend registered via entry point"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["parsecraft"]

[project.entry-points."parsecraft.backends"]
example-echo = "parsecraft_example_backend:factory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsecraft_example_backend"]
