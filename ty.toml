# type checker rules - see https://docs.astral.sh/ty/reference/rules/

[environment]
python-version = "3.13"

[src]
include = [
    "src",
    "tests",
]
# `backends/ocr/_vendored` (ported model code, ADR-0008) and the OCR impl
# modules are excluded from TYPE checking — deterministic in every environment.
# Their bodies are typed against optional heavy libraries (torch/transformers):
# with the light env their imports do not resolve, and with every extra
# installed ty body-checks upstream numerics and transformers' own
# site-packages (~300 diagnostics that vary with the library version). Neither
# state is a code-quality signal. These modules' behaviour is validated by the
# offline stub suite and the GPU tier with real weights (pc-4u7.36). Every
# other module — including all of routing, pipeline, cache, cli, adapters and
# the light backends — stays fully type-checked.
exclude = [
    "src/parsecraft/backends/ocr/_vendored",
    "src/parsecraft/backends/ocr/_common.py",
    "src/parsecraft/backends/ocr/_tele_impl.py",
    "src/parsecraft/backends/ocr/_unlimited_impl.py",
    "src/parsecraft/backends/ocr/_ovis_impl.py",
    "src/parsecraft/backends/ocr/_qianfan_impl.py",
    # Heavy boundary modules by convention: each imports its engine at module
    # top level, so ty body-checks them only when that engine's extra is
    # installed — an environment-dependent gate. Their contracts are exercised
    # by the offline stub suite and (where applicable) the live tiers.
    "src/parsecraft/backends/*/_impl.py",
    "src/parsecraft/backends/native/pdf_text.py",
]

[terminal]
error-on-warning = true
