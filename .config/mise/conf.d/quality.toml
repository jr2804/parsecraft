[tasks.test]
description = "Run tests with coverage (per-run data file, self-cleaned; concurrent runs cannot clash)"
# No wait_for on the format tasks (pc-flz): they are not part of `mise all` —
# nothing rewrites the tree concurrently, so there is no coverage race.
run = '''uv run python -c "import glob,os,shutil,subprocess,sys;pid=os.getpid();os.environ['COVERAGE_FILE']=f'.coverage.{pid}';rc=subprocess.call([sys.executable,'-m','pytest','--cov=parsecraft','--cov-report=term-missing',f'--cov-report=html:.htmlcov_{pid}']);shutil.rmtree(f'.htmlcov_{pid}',ignore_errors=True);[os.remove(p) for p in glob.glob(f'.coverage.{pid}')+glob.glob(f'.coverage.{pid}.*')];raise SystemExit(rc)"'''

[tasks.test-corpus]
description = "Corpus tier: opt-in network + cached public documents (15 min cold-cache budget)"
run = "uv run pytest -m corpus --run-corpus --run-downloads"

[tasks.test-gpu]
description = "GPU tier: OCR adapters on real weights (opt-in; needs an isolated .venv-gpu)"
run = ".venv-gpu/bin/python -m pytest tests/backends/test_ocr_gpu.py -m gpu --run-gpu"
run_windows = ".venv-gpu/Scripts/python -m pytest tests/backends/test_ocr_gpu.py -m gpu --run-gpu"

[tasks.test-judge]
description = "Judge tier: live typesafe-ai/jev-latest (TYPESAFE_API_KEY), zen/<model> (OPENCODE_API_KEY), or the semi-live local ollama/<model> — typesafe-sdk is a core dependency, so only the credential is needed (run: uv run pytest -m judge --run-judge)"
run = "uv run pytest -m judge --run-judge"

[tasks.test-network]
description = "Network tier: tests marked `network` (real fetches — honest name, not riding corpus)"
run = "uv run pytest -m network --run-downloads"

[tasks.smoke]
description = "Real-engine smoke: every opt-in CLI path, one run each (catches what stub tests cannot)"
run = "uv run python scripts/smoke.py"

[tasks.bench-docling]
description = "Docling vs native-pdf measurement (on-demand, NOT part of the gate; full corpus may take hours)"
run = "uv run --extra docling --extra pymupdf scripts/bench_docling.py .tmp/docling-bench/*.pdf"

[tasks.all]
description = "Run all quality checks (format-check gates the tree; nothing rewrites it)"
depends = [
  "format-check",
    "smoke",
  "test",
  "typecheck",
  "lint",
  "spell",
  "actionlint",
  "docs",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage .coverage.* coverage.xml htmlcov .htmlcov.* .htmlcov_* docs/_build"]
