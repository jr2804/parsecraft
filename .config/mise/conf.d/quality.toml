[tasks.test]
description = "Run tests with coverage (per-run data file; concurrent runs cannot clash)"
run = "COVERAGE_FILE=.coverage.$$ uv run pytest --cov=parsecraft --cov-report=term-missing --cov-report=html:.htmlcov.$$"
run_windows = "$env:COVERAGE_FILE=\".coverage.$PID\"; uv run pytest --cov=parsecraft --cov-report=term-missing --cov-report=html:.htmlcov_$PID"

[tasks.test-corpus]
description = "Corpus tier: opt-in network + cached public documents (15 min cold-cache budget)"
run = "uv run pytest -m corpus --run-corpus --run-downloads"

[tasks.test-gpu]
description = "GPU tier: OCR adapters on real weights (opt-in; needs an isolated .venv-gpu)"
run = ".venv-gpu/bin/python -m pytest tests/test_backends_ocr_gpu.py -m gpu --run-gpu"
run_windows = ".venv-gpu/Scripts/python -m pytest tests/test_backends_ocr_gpu.py -m gpu --run-gpu"

[tasks.test-judge]
description = "Judge tier: live ollaya daemon answers (opt-in; offline by default)"
run = "uv run pytest -m judge --run-judge"

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "typecheck",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage .coverage.* coverage.xml htmlcov .htmlcov.* docs/_build"]
