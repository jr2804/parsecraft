[tasks.lint]
description = "Run linter (ruff)"
run = 'ruff check src/ tests/ --fix --no-cache'

[tasks.typecheck]
description = "Run type checker (ty)"
run = 'ty check src/ tests/'

[tasks.spell]
description = "Run spell checker (codespell)"
run = "codespell src/ tests/"

[tasks.actionlint]
description = "Lint GitHub Actions workflows (semantics: strategy/matrix keys, expressions — what YAML parsing cannot see)"
# No arguments: actionlint defaults to .github/workflows/*.{yml,yaml}.
run = "actionlint"
