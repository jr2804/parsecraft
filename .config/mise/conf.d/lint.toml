[tasks.lint]
description = "Fix lint findings (ruff --fix) — the explicit fixer; NOT part of `mise all`"
# pc-9p6.2: a gate task must never rewrite the tree it gates. This task is the
# explicit fixer only, exactly like `mise format` (pc-flz): run it on purpose,
# then re-run the gate. `mise all` uses `lint-check`, which cannot write.
run = 'ruff check src/ tests/ --fix --no-cache'

[tasks.lint-check]
description = "Verify the tree is lint-canonical (ruff) - never rewrites"
# The ONLY lint task in `mise all` (pc-9p6.2). Same rule set as `lint`, without
# `--fix`: findings fail the gate with ruff's own message instead of being
# silently repaired into a false green. Before this split, `mise all` ran
# `format-check` first and `lint --fix` second, so a lint finding was rewritten
# away mid-gate and the tree the gate validated was not the tree the caller had.
run = 'ruff check src/ tests/ --no-cache'

[tasks.typecheck]
description = "Run type checker (ty) against the PROJECT venv, never a stray one"
# ty honours $VIRTUAL_ENV, and a session that activated another tree's venv (the
# all-extras .venv is the usual culprit) makes every optional-extra import look
# resolvable - so `ty: ignore[unresolved-import]` markers are reported as unused
# and the gate goes red on a tree that is green. Pinning VIRTUAL_ENV to this
# project's own venv makes the check hermetic and worktree-correct.
env = { VIRTUAL_ENV = "{{config_root}}/.venv" }
run = 'ty check src/ tests/'

[tasks.spell]
description = "Run spell checker (codespell)"
run = "codespell src/ tests/"

[tasks.actionlint]
description = "Lint GitHub Actions workflows (jactionlint — maintained actionlint fork; semantics: strategy/matrix keys, expressions — what YAML parsing cannot see)"
# No arguments: jactionlint defaults to .github/workflows/*.{yml,yaml}.
run = "jactionlint"
