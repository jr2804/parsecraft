[tasks.format]
description = "Format code (ruff, isort, pyreorder)"
run = [
	"pyreorder run src/ tests/ scripts/ examples/ --config .config/pyreorder.toml",
	"ruff format src/ tests/ examples/",
	"ruff check src/ tests/ examples/ --select I --fix",
]

[tasks.format-md]
description = "Lint and reformat Markdown files with rumdl"
run = "rumdl fmt --config .config/rumdl.toml src/ docs/ tests/ examples/ scripts/ ./"

[tasks.format-check]
description = "Verify the committed state is formatter-canonical (pyreorder, rumdl, ruff) - never rewrites"
# A gate that only FORMATS cannot verify a tree: drift lands silently and every
# later gate run rewrites files in the shared worktree (two phantom-diff
# classes landed that way in 2026-10: unsorted Python, MD046/MD013 Markdown).
# This task fails instead of fixing, and CI runs it alone - so a commit must be
# canonical before it lands. Locally it waits for the formatters, which is what
# makes the developer-facing gate still auto-fix.
wait_for = ["format", "format-md"]
run = [
	"pyreorder check src/ tests/ scripts/ examples/ --config .config/pyreorder.toml",
	"rumdl check --config .config/rumdl.toml src/ docs/ tests/ examples/ scripts/ ./",
	"ruff format --check src/ tests/ examples/",
	"ruff check src/ tests/ examples/ --select I",
]
