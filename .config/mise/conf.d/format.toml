[tasks.format]
description = "Format code (ruff, isort, pyreorder) — the explicit fixer; NOT part of `mise all`"
# pc-flz: `mise all` runs format-check on the working tree AS IT STANDS and
# never rewrites, so a non-canonical tree fails the gate with the formatter's
# own message instead of being silently fixed into a false green. When that
# happens, run `mise format` explicitly and re-run the gate.
run = [
	"pyreorder run src/ tests/ scripts/ examples/ --config .config/pyreorder.toml",
	"ruff format src/ tests/ examples/",
	"ruff check src/ tests/ examples/ --select I --fix",
]

[tasks.format-md]
description = "Lint and reformat Markdown files with rumdl; NOT part of `mise all`"
run = "rumdl fmt --config .config/rumdl.toml src/ docs/ tests/ examples/ scripts/ ./"

[tasks.format-check]
description = "Verify the working tree is formatter-canonical (pyreorder, rumdl, ruff) - never rewrites"
# The ONLY format task in `mise all` (pc-flz): it runs on the working tree AS
# IT STANDS, so a non-canonical tree fails the gate with the formatter's own
# message instead of being silently rewritten into a false green — exactly how
# 6572baf's non-canonical commit passed locally. `mise format` is the explicit
# fixer. CI runs it alone, unchanged.
run = [
	"pyreorder check src/ tests/ scripts/ examples/ --config .config/pyreorder.toml",
	"rumdl check --config .config/rumdl.toml src/ docs/ tests/ examples/ scripts/ ./",
	"ruff format --check src/ tests/ examples/",
	"ruff check src/ tests/ examples/ --select I",
]
