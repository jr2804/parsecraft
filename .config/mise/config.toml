# mise configuration
# Task definitions are in conf.d/*.toml files (automatically loaded by mise)
[tools]
# basic frameworks that should always be available
node = "latest"
bun = "latest"

# Linter/formatter/type checker tools — PINNED, not "latest": the gate must
# be deterministic (2026-10-09: ruff 0.16.10 / ty 0.0.85 rule updates turned
# long-green committed code red with no code change). Bump deliberately, in
# a commit that fixes whatever the new rules flag.
"ruff" = "0.16.10"
"ty" = "0.0.85"
"rumdl" = "0.2.78"
"pypi:pyreorder" = "2026.10.1"
"pypi:codespell" = "2.4.3"
# Workflow SEMANTICS, which ruff/PyYAML cannot see: unknown strategy keys,
# missing matrix keys, bad expressions (pc-8a1: the 36f8b7e matrix demotion).
"actionlint" = "1.7.12"

# CLI tools rg and tree-cli -> use `rg --files | tree-cli --fromfile` to get a nice tree view of the project files
ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }
"pypi:sloppylint" = "latest"
"pypi:ai-slop-detector" = "latest"
"npm:@yuvrajangadsingh/vibecheck" = "latest"
"npm:aislop" = "latest"
"github:djinn-soul/CytoScnPy" = "latest"
"github:ChuprinaDaria/Vibecode-Cleaner-Fartrun" = "latest"
"github:yoanbernabeu/grepai" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"pypi:repowise" = "latest"
"github:1broseidon/ketch" = "latest"
"github:AlmogBaku/debug-skill" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:gastownhall/beads" = "latest"
"github:dolthub/dolt" = "latest"
"pypi:beads-mcp" = "latest"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
