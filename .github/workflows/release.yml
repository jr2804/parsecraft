name: release

# Gated on CI: a commit is only tagged/released/published/deployed when its
# `ci` workflow run succeeded — no releases from a red or infra-failed commit.
on:
  # jactionlint-ignore[dangerous-triggers] — the fork-pwn vector this rule
  # warns about is closed in the release job's `if`: only PUSH-triggered ci
  # runs on branch main can release (workflow_run.event == 'push'), so a
  # fork's pull_request run can never satisfy it, whatever its branch name.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:

  release:
    # Releases are deliberate milestones, not a side effect of pushing.
    # A push whose head commit message contains [skip release] is validated
    # by CI but never tagged, published or deployed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    # Observed ~4 min end to end (version+tag+build+notes); 20 min bounds a hang.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    # The ONLY checkout in this workflow that keeps git credentials: the
    # "Create and push tag" step below pushes via git, which authenticates
    # with them. Every other checkout sets persist-credentials: false.
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        # No cache in the release job: the built artifacts are published
        # (cache-poisoning), and one build per release gains nothing from it.
        enable-cache: false

    - name: Compute next calendar version
      id: version
      run: |
        set -euo pipefail

        existing_head_tag="$(git tag --points-at HEAD --sort=-version:refname | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | head -n 1 || true)"
        if [ -n "$existing_head_tag" ]; then
          echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
          echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        year="$(date -u +%Y)"
        month="$(date -u +%m)"
        month="${month#0}"

        git fetch --tags --force

        prefix="${year}.${month}."
        highest="$(git tag --list "${prefix}*" | sed -n "s/^${year}\\.${month}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -n 1)"
        counter="${highest:-0}"
        next="$((counter + 1))"
        version="${year}.${month}.${next}"

        while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
          next="$((next + 1))"
          version="${year}.${month}.${next}"
        done

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "needs_tag=true" >> "$GITHUB_OUTPUT"

    - name: Configure git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create and push tag
      if: steps.version.outputs.needs_tag == 'true'
      run: |
        set -euo pipefail
        version="${{ steps.version.outputs.version }}"
        git tag -a "$version" -m "Release $version"
        git push origin "$version"

    - name: Build package
      run: uv build

    - name: Create GitHub release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ${{ steps.version.outputs.version }}
        files: dist/*
        generate_release_notes: true

    # AI release notes (LLM-summarised, deterministic fallback). Cosmetic only:
    # `continue-on-error` keeps the release intact if the API is unreachable,
    # unconfigured, or returns a bad summary — the auto-generated notes stay.
    - name: AI release notes (OpenRouter)
      if: env.OPENROUTER_API_KEY != ''
      continue-on-error: true
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="${{ steps.version.outputs.version }}"
        prev="$(git tag --sort=-version:refname | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | sed -n '2p' || true)"
        range="${prev:+$prev..}$version"
        git log "$range" --format='- %s' | head -n 120 > commits.txt

        {
          echo "Write concise, user-facing release notes in Markdown for the"
          echo "Python package parsecraft (document-intelligence: aligns existing"
          echo "converters/parsers/OCR models behind one workflow and typed IR)."
          echo "Rules: use ONLY facts from the commit list below — never invent"
          echo "features or numbers; group under short Markdown headings (Features,"
          echo "Improvements, Documentation, CI); start with a 2-3 bullet highlight"
          echo "list; no preamble, no closing remark. Commit list:"
          cat commits.txt
        } > prompt.txt

        python3 - <<'PY' > ai-notes.md
        import json, os, urllib.request

        request = urllib.request.Request(
            "https://openrouter.ai/api/v1/chat/completions",
            data=json.dumps({
                "model": os.environ["OPENROUTER_MODEL"],
                "messages": [{"role": "user", "content": open("prompt.txt", encoding="utf-8").read()}],
            }).encode(),
            headers={
                "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                "Content-Type": "application/json",
            },
        )
        with urllib.request.urlopen(request, timeout=120) as response:
            payload = json.load(response)
        print(payload["choices"][0]["message"]["content"])
        PY

        {
          cat ai-notes.md
          echo
          echo "<details><summary>Full commit list</summary>"
          echo
          cat commits.txt
          echo
          echo "</details>"
          echo
          echo "**Full Changelog**: https://github.com/jr2804/parsecraft/compare/${range}"
        } > release-body.md
        gh release edit "$version" --notes-file release-body.md

        rm -f commits.txt prompt.txt ai-notes.md release-body.md

    - name: Upload distributions
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    needs:
    - release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/parsecraft/
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (branch head)
      with:
        skip-existing: true

  deploy-docs:
    needs:
    - release
    runs-on: ubuntu-latest
    # Observed 3-5 min (mise dev + docs build + pages deploy); 20 min bounds a hang.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        # No cache in a publishing job (cache-poisoning): what this job deploys
        # must not be restorable from a cache an untrusted run could write.
        enable-cache: false

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: true
        # Publishing job: what it deploys must not be restorable from a cache
        # an untrusted run could write (same cache-poisoning reasoning as the
        # uv cache above).
        cache: false

    - name: Install dependencies
      run: mise dev

    - name: Build documentation site
      run: mise docs

    - name: Setup Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
      with:
        path: site/

    - id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
