name: ci

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Minimal token: no ci job needs more than read access to the repository
# (the release workflow has its own, deliberately elevated per-job blocks).
permissions:
  contents: read

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:

  extras:
    name: extras resolve (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    # Root AGENTS.md rule 10: every optional extra must install jointly.
    - name: Assert every extra resolves jointly
      run: uv sync -U --all-extras --all-groups --all-packages --dry-run

  # Root AGENTS.md rule 10, ASSERTED ON EVERY CELL. The `extras` job above
  # verifies joint resolution on 3.13 (GIL) only; this job covers the cells it
  # misses (3.14 and 3.14t) and passes or fails on the verdict.
  #
  # It used to be `continue-on-error: true`, which made every cause look alike:
  # a genuine rule 10 violation (an extras set that cannot resolve) was
  # indistinguishable from a dependency whose upstream ships no wheel for the
  # interpreter, and the job showed a red X that had to be dismissed on every
  # run — so nobody read it (pc-7qq). The script now classifies the failure:
  # a package recorded in `scripts/extras_availability.py::KNOWN_GAPS` with a
  # reason and a re-entry condition is a notice and the cell passes; anything
  # else — a new missing wheel, an unsatisfiable graph, a build failure — fails
  # the cell. Tolerance must be declared, never assumed.
  extras-availability:
    name: extras availability (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.14t"]

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    # The verdict is the script's, not the resolver's: a known upstream gap
    # passes, everything else fails. `--python` is passed explicitly because
    # without it uv answers for whatever venv sits in the checkout, which is
    # how a 3.14t cell could report green while the 3.14t resolution failed.
    #
    # `--no-project` is load-bearing: without it `uv run` first builds the
    # PROJECT environment for the cell interpreter, which on 3.14t is the very
    # resolution this step exists to classify — the job would die before the
    # script ran (observed: a 3.14t `uv run` hung for 8+ min resolving extras).
    # The script needs only the standard library, and it invokes `uv` itself
    # for the resolution under test.
    - name: Assert every extra resolves jointly
      run: >-
        uv run --no-project python scripts/extras_availability.py
        --cell "${{ matrix.os }} / ${{ matrix.python-version }}"
        --python "${{ matrix.python-version }}"


  quality:
    runs-on: ubuntu-latest
    # Observed ~2 min; 10 min catches a hang without burning the runner.
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: true
        # Never restore the tool cache: a cache built on a previous runner
        # image leaves pypi:-venv shebangs pointing at dead interpreters
        # (2026-10-29 ubuntu-26.04 outage). Cold install every run instead.
        cache: false

    - name: Install dependencies
      run: mise dev

    - name: Run linter
      # `lint-check`, never `lint`: `lint` is ruff --fix, a rewriter, so running
      # it here repaired a lint finding on the runner and exited 0 — CI could
      # not fail on a lint error the local `mise all` gate rejects (observed
      # 2026-11-01: an unused import plus a canonical block passed CI green).
      # Same split as `mise all` (pc-9p6.2) and `format-check` below (pc-flz).
      run: mise lint-check

    # Type check against the CANONICAL DEV ENV that `mise dev` produced above
    # (uv sync --dev --all-groups --extra web — no heavy extras). ty's verdict
    # is extras-dependent (pc-180): in an all-extras env the
    # `ty: ignore[unresolved-import]` markers in _surya_impl.py and
    # _convert.py turn into warning[unused-ignore-comment] and a well-meaning
    # contributor deletes load-bearing markers. The task itself pins
    # VIRTUAL_ENV to this project's venv, so the check is hermetic here.
    - name: Run type checker (dev env, not all-extras)
      run: mise typecheck

    - name: Check spelling
      run: mise spell

    # Fails on non-canonical formatting instead of rewriting: the formatters
    # above run only locally, so this is the check that makes a committed tree
    # provably canonical (pyreorder / rumdl / ruff).
    - name: Check formatting
      run: mise format-check

    # Workflow SEMANTICS, not YAML syntax: unknown strategy keys, missing
    # matrix keys, bad expressions — the class PyYAML and the test suite
    # cannot see (pc-8a1: the 36f8b7e matrix demotion).
    - name: Lint workflows
      run: mise actionlint

  tests:
    needs:
    - quality
    # Observed 8-12 min across the matrix; 30 min bounds a hung cell.
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.13"
          - "3.14"
        # 3.14t (free-threaded) cells are SUSPENDED (ADR-0001 amendment
        # 2026-10-09): onnxruntime publishes no free-threaded macOS/Windows
        # wheels and has no sdist, so a heavy extra cannot resolve there.
        # Re-enable when those wheels exist: re-add the three include entries in
        # the DEEPENED shape used below (list item at 10 spaces, its nested key at
        # 12) - the original 8-space form is a hand-edited shape this file no
        # longer uses.
        include:
          - os: ubuntu-latest
            python-version: "3.15-dev"

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
    env:
      # The dev toolset is not needed by the test job (only uv + Python), and
      # some tools lack wheels on the newest interpreters.
      MISE_AUTO_INSTALL: "0"

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:

        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: false
        # See the quality job: never restore the tool cache.
        cache: false

    - name: Install dependencies
      run: mise dev

    - name: Run tests with coverage
      run: mise test

  # Documentation build (optional)
  docs:
    needs:
    - quality
    runs-on: ubuntu-latest
    # Observed 3-5 min (mise dev + zensical build); 15 min bounds a hang.
    timeout-minutes: 15


    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: true
        # See the quality job: never restore the tool cache.
        cache: false

    - name: Install dependencies
      run: mise dev

    - name: Build documentation
      run: mise docs

