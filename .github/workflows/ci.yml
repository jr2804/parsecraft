name: ci

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Minimal token: no ci job needs more than read access to the repository
# (the release workflow has its own, deliberately elevated per-job blocks).
permissions:
  contents: read

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:

  extras:
    name: extras resolve (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    # Root AGENTS.md rule 10: every optional extra must install jointly.
    - name: Assert every extra resolves jointly
      run: uv sync -U --all-extras --all-groups --all-packages --dry-run

  # Root AGENTS.md rule 10, REPORTED NOT GATED. The `extras` job above verifies
  # joint resolution on 3.13 (GIL) only; this job covers the cells it misses
  # (3.14 and 3.14t) so a dependency that cannot resolve there is visible
  # instead of shipping green. It never gates: a gating --all-extras job on
  # 3.14t fails on mineru today. Promotion path: when onnxruntime publishes
  # free-threaded macOS/Windows wheels, drop continue-on-error and it becomes
  # the gate rule 10 always claimed to have.
  extras-availability:
    name: extras availability (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14", "3.14t"]

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Assert every extra resolves jointly
      run: uv sync -U --all-extras --all-groups --all-packages --dry-run

    # Alert-fatigue mitigation: a red cell must be read, not tuned out. Every
    # cell carries the known cause and the re-entry condition; a failing cell
    # additionally raises a notice annotation.
    - name: Explain this cell
      if: always()
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        ### extras availability - ${{ matrix.os }} / ${{ matrix.python-version }}

        **Known cause of expected failures:** onnxruntime (pulled by the
        mineru extra) publishes **no free-threaded macOS/Windows wheels** and
        has no sdist, so uv sync --all-extras cannot resolve on those cells.
        PEP 508 has no free-threaded marker, so it cannot be gated out.

        **Re-entry condition:** when onnxruntime publishes free-threaded
        macOS/Windows wheels, drop continue-on-error from this job and it
        becomes the gate root AGENTS.md rule 10 always claimed to have.

        See docs/development/ci-cd.md.
        EOF

    - name: Annotate expected failure
      if: failure()
      run: |
        echo "::notice title=extras availability::expected: onnxruntime ships no free-threaded macOS/Windows wheels; see the step summary for the re-entry condition"

  quality:
    runs-on: ubuntu-latest
    # Observed ~2 min; 10 min catches a hang without burning the runner.
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: true

    - name: Install dependencies
      run: mise dev

    - name: Run linter
      run: mise lint

    - name: Check spelling
      run: mise spell

    # Fails on non-canonical formatting instead of rewriting: the formatters
    # above run only locally, so this is the check that makes a committed tree
    # provably canonical (pyreorder / rumdl / ruff).
    - name: Check formatting
      run: mise format-check

    # Workflow SEMANTICS, not YAML syntax: unknown strategy keys, missing
    # matrix keys, bad expressions — the class PyYAML and the test suite
    # cannot see (pc-8a1: the 36f8b7e matrix demotion).
    - name: Lint workflows
      run: mise actionlint

  tests:
    needs:
    - quality
    # Observed 8-12 min across the matrix; 30 min bounds a hung cell.
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.13"
          - "3.14"
        # 3.14t (free-threaded) cells are SUSPENDED (ADR-0001 amendment
        # 2026-10-09): onnxruntime publishes no free-threaded macOS/Windows
        # wheels and has no sdist, so a heavy extra cannot resolve there.
        # Re-enable when those wheels exist: re-add the three include entries in
        # the DEEPENED shape used below (list item at 10 spaces, its nested key at
        # 12) - the original 8-space form is a hand-edited shape this file no
        # longer uses.
        include:
          - os: ubuntu-latest
            python-version: "3.15-dev"

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
    env:
      # The dev toolset is not needed by the test job (only uv + Python), and
      # some tools lack wheels on the newest interpreters.
      MISE_AUTO_INSTALL: "0"

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:

        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: false

    - name: Install dependencies
      run: mise dev

    - name: Run tests with coverage
      run: mise test

  # Documentation build (optional)
  docs:
    needs:
    - quality
    runs-on: ubuntu-latest
    # Observed 3-5 min (mise dev + zensical build); 15 min bounds a hang.
    timeout-minutes: 15


    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
      with:
        install: true

    - name: Install dependencies
      run: mise dev

    - name: Build documentation
      run: mise docs

