name: ci

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:

  extras:
    name: extras resolve (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    # Root AGENTS.md rule 10: every optional extra must install jointly.
    - name: Assert every extra resolves jointly
      run: uv sync -U --all-extras --all-groups --all-packages --dry-run

  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: true

    - name: Install dependencies
      run: mise dev

    - name: Run linter
      run: mise lint

    - name: Check spelling
      run: mise spell

  tests:
    needs:
    - quality
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        python-version:
        - "3.13"
        - "3.14"
        include:
        - os: ubuntu-latest
          python-version: "3.14t"
        - os: macos-latest
          python-version: "3.14t"
        - os: windows-latest
          python-version: "3.14t"
        - os: ubuntu-latest
          python-version: "3.15-dev"

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15-dev' }}
    env:
      # The dev toolset (e.g. repowise -> lancedb) has no free-threaded wheels;
      # the test job only needs uv + Python, so skip mise tool installation.
      MISE_AUTO_INSTALL: "0"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:

        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: false

    - name: Install dependencies
      run: mise dev

    - name: Run tests with coverage
      run: mise test

  # Documentation build (optional)
  docs:
    needs:
    - quality
    runs-on: ubuntu-latest


    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: true

    - name: Install dependencies
      run: mise dev

    - name: Build documentation
      run: mise docs

